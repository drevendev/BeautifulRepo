name: Live trade_simulation Pages visual, keyboard and contrast evidence

on:
  pull_request:
    paths:
      - '.github/workflows/trade-pages-visual.yml'
      - '.github/action-pins.json'
      - 'case-studies/trade-pages-probe.mjs'
      - 'case-studies/contrast-metrics.mjs'
      - 'case-studies/contrast-metrics.test.mjs'
      - 'case-studies/keyboard-path-metrics.mjs'
      - 'case-studies/keyboard-path-metrics.test.mjs'
      - 'case-studies/m4-expansion-metrics.mjs'
      - 'case-studies/m4-expansion-metrics.test.mjs'
      - 'case-studies/m4-table-keyboard-metrics.mjs'
      - 'case-studies/m4-table-keyboard-metrics.test.mjs'
      - 'case-studies/trade-served-assets.mjs'
      - 'case-studies/trade-served-assets.test.mjs'
      - 'case-studies/trade_simulation.md'
  workflow_dispatch:

# This job reads a public site and exact public source. No target repository writes.
permissions:
  contents: read

jobs:
  observe-pages:
    name: Live Pages 320px visual, keyboard and sampled text contrast
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out BeautifulRepo browser probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 ref inspected 2026-10-05
        with:
          persist-credentials: false
      - name: Select Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 ref inspected 2026-10-30
        with:
          node-version: '22'
      - name: Run offline contrast-metric regressions
        run: node --test case-studies/contrast-metrics.test.mjs
      - name: Run offline keyboard-path regressions
        run: node --test case-studies/keyboard-path-metrics.test.mjs
      - name: Run offline expanded-M4 regressions
        run: node --test case-studies/m4-expansion-metrics.test.mjs
      - name: Run offline M4 table keyboard observation regressions
        run: node --test case-studies/m4-table-keyboard-metrics.test.mjs
      - name: Run offline served-asset regressions
        run: node --test case-studies/trade-served-assets.test.mjs
      - name: Fetch the exact target source and lockfile
        shell: bash
        env:
          TARGET_SHA: 36bd70ea399813accf21d350aa5a0067f059757e
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone -q --no-checkout --filter=blob:none --depth 1 \
            https://github.com/drevendev/trade_simulation.git "$RUNNER_TEMP/trade-after"
          git -C "$RUNNER_TEMP/trade-after" fetch --no-tags --depth 1 origin "$TARGET_SHA"
          git -C "$RUNNER_TEMP/trade-after" -c core.hooksPath=/dev/null checkout --detach --force FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/trade-after" rev-parse HEAD)" = "$TARGET_SHA"
      - name: Install only the locked browser tooling (no target scripts)
        working-directory: ${{ runner.temp }}/trade-after
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Observe served data, expanded M4 and native table panning
        shell: bash
        env:
          TARGET_ROOT: ${{ runner.temp }}/trade-after
          OUTPUT_DIR: ${{ runner.temp }}/trade-pages-evidence
          TARGET_URL: https://drevendev.github.io/trade_simulation/
        run: node case-studies/trade-pages-probe.mjs
      - name: Compare served HTML CSS JS bytes against pinned source
        shell: bash
        env:
          TARGET_ROOT: ${{ runner.temp }}/trade-after
          OUTPUT_DIR: ${{ runner.temp }}/trade-pages-evidence
          TARGET_URL: https://drevendev.github.io/trade_simulation/
        run: node case-studies/trade-served-assets.mjs
      - name: Preserve browser evidence and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 ref inspected 2026-10-30
        with:
          name: trade-pages-320px-keyboard-contrast-observations
          path: ${{ runner.temp }}/trade-pages-evidence/
          if-no-files-found: warn
          retention-days: 14
