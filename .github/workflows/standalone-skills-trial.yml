name: Standalone skills CLI copy trial

# This observes per-skill file distribution, not agent discovery or execution.
on:
  pull_request:
    paths:
      - .github/workflows/standalone-skills-trial.yml
      - skills/**
      - scripts/standalone_skill_preflight.py
      - scripts/sync_standalone_audit.py
      - scripts/sync_standalone_release.py
      - scripts/verify_copied_release.py
      - scripts/verify_copied_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-layout:
    # Avoid executing an external npm CLI on fork-submitted code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 ref inspected 2026-10-05
        with:
          # PR events default to a synthetic merge SHA; use the exact source head.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 ref inspected 2026-10-30
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 ref inspected 2026-10-29
        with:
          python-version: '3.11'
      - name: Observe a real CLI copy of each skill into a fresh disposable project
        shell: bash
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_FUND: 'false'
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --version
          python --version
          source_sha="$(git rev-parse HEAD)"
          expected_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          if [ "$source_sha" != "$expected_sha" ]; then
            echo "Checkout SHA $source_sha does not match expected source $expected_sha" >&2
            exit 1
          fi
          printf 'Copied source HEAD: %s\nWorkflow event SHA: %s\n' "$source_sha" "$GITHUB_SHA"
          work="$RUNNER_TEMP/beautifulrepo-skills-trial"
          mkdir -p "$work/results"
          printf '%s\n' "$source_sha" > "$work/results/checkout-source-sha"
          printf '%s\n' "$GITHUB_SHA" > "$work/results/workflow-event-sha"
          # The repository-owned audited files and copied package must not drift.
          python -I "$GITHUB_WORKSPACE/scripts/sync_standalone_audit.py"
          python -I "$GITHUB_WORKSPACE/scripts/sync_standalone_release.py"
          for skill in audit-repo improve-readme trust-surfaces draft-release-notes; do
            project="$work/projects/$skill"
            mkdir -p "$project"
            (
              cd "$project"
              npx --yes skills@1.7.6 add "$GITHUB_WORKSPACE" --skill "$skill" --agent codex --copy --yes
            )
            installed="$project/.agents/skills/$skill"
            test -f "$installed/SKILL.md" || {
              echo "CLI did not install expected skill definition: $skill" >&2
              exit 1
            }
            find "$installed" -type f -printf '%P\n' | LC_ALL=C sort > "$work/results/$skill.files"
            printf '%s\n' "$source_sha" > "$work/results/$skill.source-sha"
            set +e
            python -I "$GITHUB_WORKSPACE/scripts/standalone_skill_preflight.py" "$installed" > "$work/results/$skill.json"
            status=$?
            set -e
            printf '%s\n' "$status" > "$work/results/$skill.exit"
            cat "$work/results/$skill.json"
            # A passing pilot is a successful copied-file layout, not agent use.
            expected=1
            if [ "$skill" = "audit-repo" ] || [ "$skill" = "draft-release-notes" ]; then expected=0; fi
            if [ "$status" -ne "$expected" ]; then
              echo "Unexpected preflight exit $status for $skill" >&2
              exit 1
            fi
            python -c 'import json,sys; x=json.load(open(sys.argv[1], encoding="utf-8")); assert x["skill"] == sys.argv[2]; assert (x["state"],x["layout"]) == (("present","self-contained") if sys.argv[2] in ("audit-repo", "draft-release-notes") else ("incomplete","full-repository"))' "$work/results/$skill.json" "$skill"
            if [ "$skill" = "audit-repo" ]; then
              python -I "$GITHUB_WORKSPACE/scripts/verify_copied_audit.py" \
                --skill-root "$installed" \
                --output-dir "$work/results/audit-behavior-single" \
                > "$work/results/audit-behavior-single.json"
            elif [ "$skill" = "draft-release-notes" ]; then
              python -I "$GITHUB_WORKSPACE/scripts/verify_copied_release.py" \
                --skill-root "$installed" --output "$work/results/release-inventory-single.json"
            fi
          done
          # The same installer must also handle all four in a single project.
          combined="$work/projects/all-four"
          mkdir -p "$combined"
          (
            cd "$combined"
            npx --yes skills@1.7.6 add "$GITHUB_WORKSPACE" --skill '*' --agent codex --copy --yes
          )
          for skill in audit-repo improve-readme trust-surfaces draft-release-notes; do
            installed="$combined/.agents/skills/$skill"
            test -f "$installed/SKILL.md" || {
              echo "Combined CLI install omitted $skill" >&2
              exit 1
            }
            find "$installed" -type f -printf '%P\n' | LC_ALL=C sort > "$work/results/all-four-$skill.files"
            set +e
            python -I "$GITHUB_WORKSPACE/scripts/standalone_skill_preflight.py" "$installed" > "$work/results/all-four-$skill.json"
            status=$?
            set -e
            printf '%s\n' "$status" > "$work/results/all-four-$skill.exit"
            expected=1
            if [ "$skill" = "audit-repo" ] || [ "$skill" = "draft-release-notes" ]; then expected=0; fi
            if [ "$status" -ne "$expected" ]; then
              echo "Combined install changed $skill preflight outcome: $status" >&2
              exit 1
            fi
            python -c 'import json,sys; x=json.load(open(sys.argv[1], encoding="utf-8")); assert x["skill"] == sys.argv[2]; assert (x["state"],x["layout"]) == (("present","self-contained") if sys.argv[2] in ("audit-repo", "draft-release-notes") else ("incomplete","full-repository"))' "$work/results/all-four-$skill.json" "$skill"
            if [ "$skill" = "audit-repo" ]; then
              python -I "$GITHUB_WORKSPACE/scripts/verify_copied_audit.py" \
                --skill-root "$installed" \
                --output-dir "$work/results/audit-behavior-combined" \
                > "$work/results/audit-behavior-combined.json"
            elif [ "$skill" = "draft-release-notes" ]; then
              python -I "$GITHUB_WORKSPACE/scripts/verify_copied_release.py" \
                --skill-root "$installed" --output "$work/results/release-inventory-combined.json"
            fi
          done
      - name: Preserve the observed copied-file lists and required-path diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 ref inspected 2026-10-30
        with:
          name: standalone-skill-copy-layout
          path: ${{ runner.temp }}/beautifulrepo-skills-trial/results/
          if-no-files-found: warn
          retention-days: 7
