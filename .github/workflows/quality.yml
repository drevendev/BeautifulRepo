name: Quality checks
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
# A new push to a pull request cancels its superseded run; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  catalog:
    # Linux job names stay "Python <version>": the master ruleset requires them.
    name: Python ${{ matrix.python-version }}${{ matrix.os == 'windows-latest' && ' (Windows)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.14']
        include:
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 ref inspected 2026-10-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 inspected 2026-10-19
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show selected interpreter
        run: python --version
      - name: Run the unit tests
        run: python -m unittest discover -s tests -v
      - name: Check catalog metadata and generated view
        run: python tools/catalog.py
      - name: Check repository-owned Markdown destinations
        run: python tools/docs_links.py
      - name: Check HTML navigation and local anchors
        run: python tools/html_navigation.py
      - name: Verify root README GitHub Actions badge target
        run: python -I tools/workflow_badges.py --root . --repo drevendev/BeautifulRepo --require-badge
      - name: Audit BeautifulRepo's own entry points
        run: python tools/repo_audit.py .

  lint:
    # Developer-only lint with a hash-pinned ruff (ruff.toml). Not a required check
    # until it has stayed green for a while; the tools never import ruff.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 ref inspected 2026-10-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 inspected 2026-10-19
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/lint-requirements.txt
      - name: Install the pinned linter
        run: python -m pip install --require-hashes --no-deps -r .github/lint-requirements.txt
      - name: Lint tools, tests and examples
        run: ruff check --output-format github

  action:
    # Exercises action.yml the way another repository would call it.
    name: Action self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 ref inspected 2026-10-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 inspected 2026-10-19
        with:
          python-version: '3.11'
      - name: Check BeautifulRepo with its own action
        uses: ./
      - name: Create a fixture with a broken link in vendor/
        shell: bash
        run: |
          mkdir -p .selftest/broken/vendor
          printf '# Fixture\n\nA healthy entry point.\n' > .selftest/broken/README.md
          printf '[Missing](does-not-exist.md)\n' > .selftest/broken/vendor/README.md
      - name: Broken link must fail
        id: broken
        continue-on-error: true
        uses: ./
        with:
          path: .selftest/broken
          checks: docs-links html-navigation
      - name: Unknown check name must fail
        id: typo
        continue-on-error: true
        uses: ./
        with:
          checks: audit doc-links
      - name: One check per line must still run, and find the broken link
        id: newline
        continue-on-error: true
        uses: ./
        with:
          path: .selftest/broken
          checks: |
            docs-links
            html-navigation
      - name: An empty check list must fail
        id: empty
        continue-on-error: true
        uses: ./
        with:
          checks: ' '
      - name: Invalid audit profile must fail
        id: invalid_profile
        continue-on-error: true
        uses: ./
        with:
          checks: docs-links
          audit-profile: unknown
      - name: Internal profile can run on an internal-shaped checkout
        uses: ./
        with:
          path: .selftest/broken
          checks: audit
          audit-profile: internal
      - name: Excluding vendor/ must pass
        uses: ./
        with:
          path: .selftest/broken
          checks: docs-links html-navigation
          exclude: |
            vendor
      - name: Require the negative cases to have failed
        shell: bash
        env:
          BROKEN: ${{ steps.broken.outcome }}
          TYPO: ${{ steps.typo.outcome }}
          NEWLINE: ${{ steps.newline.outcome }}
          EMPTY: ${{ steps.empty.outcome }}
          INVALID_PROFILE: ${{ steps.invalid_profile.outcome }}
        run: |
          echo "broken-link run: $BROKEN; unknown-check run: $TYPO"
          echo "one-per-line run: $NEWLINE; empty-list run: $EMPTY"
          test "$BROKEN" = failure
          test "$TYPO" = failure
          test "$NEWLINE" = failure
          test "$EMPTY" = failure
          test "$INVALID_PROFILE" = failure
