name: Catalog quality
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  catalog:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 ref inspected 2026-10-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 inspected 2026-10-19
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show selected interpreter
        run: python --version
      - name: Test catalog behavior
        run: python -m unittest discover -s tests -v
      - name: Check catalog metadata and generated view
        run: python tools/catalog.py
      - name: Check repository-owned Markdown destinations
        run: python tools/docs_links.py
      - name: Check HTML navigation and local anchors
        run: python tools/html_navigation.py
