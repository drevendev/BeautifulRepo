# Generate reproducible, browser-rendered evidence from fictional fixtures only.
# This is an optional showcase check, not a required merge gate or WCAG/mobile test.
name: Synthetic audit browser evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/showcase-capture.yml'
      - 'examples/combined-audit/**'
      - 'tools/audit_bundle.py'
      - 'tools/repo_audit.py'
      - 'tools/docs_links.py'
      - 'tools/html_navigation.py'

permissions:
  contents: read

jobs:
  screenshot:
    name: Render synthetic audit (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 ref inspected 2026-10-05
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 ref inspected 2026-10-29
        with:
          python-version: '3.11'
      - name: Verify installed browser
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Generate HTML and two real PNG screenshots
        run: |
          python -I examples/combined-audit/capture.py \
            --browser google-chrome \
            --output-dir "$RUNNER_TEMP/beautifulrepo-audit-capture"
      - name: Check output provenance and report actual PNG dimensions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import struct
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"]) / "beautifulrepo-audit-capture"
          html = (folder / "report.html").read_text(encoding="utf-8")
          assert html.startswith("<!doctype html>")
          assert "Synthetic Pocket Trails fixture." in html
          assert "0/2 local-link checks pass." in html
          assert "2/2 local-link checks pass." in html
          assert "-Read the [setup guide](docs/setup.md)" in html
          assert "+Read the [setup guide](docs/guide.md)" in html
          for name in ("desktop", "mobile"):
              png = (folder / f"{name}.png").read_bytes()
              assert len(png) > 1024 and png.startswith(b"\x89PNG\r\n\x1a\n")
              width, height = struct.unpack_from(">II", png, 16)
              assert 320 <= width <= 2560 and 320 <= height <= 2560
              print(f"{name} actual screenshot: {width}x{height}, {len(png)} bytes")
          print("Synthetic checker output verified; visual/accessibility acceptance is manual.")
          PY
      - name: Upload reviewable synthetic evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 ref inspected 2026-10-30
        with:
          name: pocket-trails-synthetic-browser-capture
          path: ${{ runner.temp }}/beautifulrepo-audit-capture/
          if-no-files-found: error
          retention-days: 7
