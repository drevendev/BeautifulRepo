name: Live trade_simulation native 400 percent browser zoom evidence

on:
  pull_request:
    paths:
      - '.github/workflows/trade-pages-zoom.yml'
      - '.github/action-pins.json'
      - 'case-studies/native-page-zoom.py'
      - 'case-studies/native-x11-capture.py'
      - 'case-studies/trade-zoom-probe.mjs'
      - 'case-studies/zoom-scroll-metrics.mjs'
      - 'case-studies/zoom-scroll-metrics.test.mjs'
      - 'case-studies/trade_simulation.md'
  workflow_dispatch:

# Read-only public Pages observation. Shortcuts target only Chromium inside Xvfb.
permissions:
  contents: read

jobs:
  native-browser-zoom:
    name: Headful Chromium native 400 percent zoom and reflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out BeautifulRepo evidence probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 ref inspected 2026-10-05
        with:
          persist-credentials: false
      - name: Select Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 ref inspected 2026-10-30
        with:
          node-version: '22'
      - name: Check probe syntax and X11 helper
        run: |
          set -euo pipefail
          node --check case-studies/trade-zoom-probe.mjs
          node --test case-studies/zoom-scroll-metrics.test.mjs
          python3 -m py_compile case-studies/native-page-zoom.py case-studies/native-x11-capture.py
          command -v xvfb-run
          ldconfig -p | grep -F libXtst.so
      - name: Fetch the immutable target revision
        shell: bash
        env:
          TARGET_SHA: 36bd70ea399813accf21d350aa5a0067f059757e
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone -q --no-checkout --filter=blob:none --depth 1 \
            https://github.com/drevendev/trade_simulation.git "$RUNNER_TEMP/trade-after"
          git -C "$RUNNER_TEMP/trade-after" fetch --no-tags --depth 1 origin "$TARGET_SHA"
          git -C "$RUNNER_TEMP/trade-after" -c core.hooksPath=/dev/null checkout --detach --force FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/trade-after" rev-parse HEAD)" = "$TARGET_SHA"
      - name: Install locked browser dependencies without target scripts
        working-directory: ${{ runner.temp }}/trade-after
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise genuine Chromium browser zoom, reflow and keyboard
        shell: bash
        env:
          TARGET_ROOT: ${{ runner.temp }}/trade-after
          OUTPUT_DIR: ${{ runner.temp }}/trade-native-zoom-evidence
          TARGET_URL: https://drevendev.github.io/trade_simulation/
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1440x1200x24' node case-studies/trade-zoom-probe.mjs
      - name: Retain screenshot and JSON observation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 ref inspected 2026-10-30
        with:
          name: trade-pages-native-400-percent-zoom
          path: ${{ runner.temp }}/trade-native-zoom-evidence/
          if-no-files-found: warn
          retention-days: 14
