<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 204">
  <title id="title">Rowcount local CSV command and result</title>
  <desc id="desc">A drawn terminal excerpt, not a screenshot: from the examples/cli-starter directory, python rowcount.py sample.csv prints Data rows: 3.</desc>
  <rect x="0" y="0" width="720" height="204" rx="16" fill="#f4f7fb"/>
  <rect x="16" y="16" width="688" height="172" rx="11" fill="#ffffff" stroke="#7b92ab" stroke-width="1.5"/>
  <text x="36" y="47" fill="#23384c" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Local command · Python 3.11+</text>
