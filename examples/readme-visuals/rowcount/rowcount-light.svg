  <text x="36" y="90" fill="#23384c" font-family="monospace" font-size="15">$ cd examples/cli-starter</text>
  <text x="36" y="119" fill="#23384c" font-family="monospace" font-size="15">$ python rowcount.py sample.csv</text>
